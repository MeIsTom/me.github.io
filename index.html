    <!-- JavaScript 代码 -->
    <script>
        // 状态变量
        let receivedDataChunks = new Map(); // 数据分片
        let fileNameData = null; // 文件名数据
        let totalDataChunks = 0; // 数据分片总数
        let currentFileFingerprint = null;
        let isProcessing = false;
        let receivedFileName = '';
        let receivedFileSize = 0;
        let isScanning = false;
        let codeReader = null;
        let scanControls = null;
        let lastDecodedText = '';
        let lastScanTime = 0;
        let scanCount = 0; // 扫描计数器
        
        // 发送端使用的CRC32计算函数（与发送端保持一致）
        function calculateCRC32(data) {
            // 优先使用pako的crc32函数确保一致性
            if (typeof pako !== 'undefined' && pako.crc32) {
                const crc = pako.crc32(data);
                return crc.toString(36).padStart(5, '0').slice(-5);
            }
            
            // 备用方案：确保与发送端一致的实现
            return calculateCRC32Fallback(data);
        }

        // CRC32备用实现（确保与发送端一致）
        function calculateCRC32Fallback(data) {
            const table = new Uint32Array(256);
            for (let i = 0; i < 256; i++) {
                let c = i;
                for (let j = 0; j < 8; j++) {
                    c = (c & 1) ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
                }
                table[i] = c;
            }
            
            let crc = 0xFFFFFFFF;
            const len = data.length;
            
            for (let i = 0; i < len; i++) {
                crc = (crc >>> 8) ^ table[(crc ^ data.charCodeAt(i)) & 0xFF];
            }
            crc = (crc ^ 0xFFFFFFFF) >>> 0;
            return crc.toString(36).padStart(5, '0').slice(-5);
        }

        // Base64解码文件名（处理发送端的编码）
        function decodeFileName(base64Name) {
            try {
                // 发送端使用TextEncoder编码，这里需要正确解码
                const binaryStr = atob(base64Name);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }
                const decoder = new TextDecoder('utf-8');
                return decoder.decode(bytes);
            } catch (e) {
                console.error('文件名解码失败:', e);
                try {
                    // 备用解码方式
                    return decodeURIComponent(atob(base64Name));
                } catch (e2) {
                    console.error('备用解码也失败:', e2);
                    return base64Name; // 如果解码失败，返回原始值
                }
            }
        }

        const floatingContainer = document.getElementById('floatingContainer');
        const currentFingerprint = document.getElementById('currentFingerprint');
        const fingerprintValue = document.getElementById('fingerprintValue');

        // 使用 ZXing
        const { BrowserQRCodeReader } = ZXing;

        // 显示浮动消息
        function showFloatingMessage(message, isError = false) {
            const floatingMsg = document.createElement('div');
            floatingMsg.className = `floating-message ${isError ? 'floating-error' : ''}`;
            floatingMsg.textContent = message;
            floatingContainer.appendChild(floatingMsg);
            
            setTimeout(() => {
                if (floatingMsg.parentNode) {
                    floatingMsg.parentNode.removeChild(floatingMsg);
                }
            }, 1500);
        }

        // 页面加载
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('二维码接收器 - 分离文件名版本加载完成');
            
            // 检查ZXing库
            if (typeof ZXing === 'undefined' || !BrowserQRCodeReader) {
                showStatus('ZXing库加载失败', 'error');
                startScanBtn.disabled = true;
                scanBtnText.textContent = '库加载失败';
                scanStatus.textContent = '请检查网络连接';
                return;
            }
            
            console.log('✅ ZXing库加载成功');
            scanStatus.textContent = '就绪，使用最新版ZXing';
            
            // 初始化摄像头列表
            await initCameraList();
            
            // 从本地存储加载数据

            updateUI();
            
            showStatus('准备就绪，请点击开始扫描', 'info');
        });

        // 初始化摄像头列表
        async function initCameraList() {
            try {
                console.log('正在检测摄像头...');
                scanStatus.textContent = '正在检测摄像头...';

                let videoInputDevices = [];
                
                try {
                    videoInputDevices = await BrowserQRCodeReader.listVideoInputDevices();
                    console.log(`✅ 通过ZXing API找到 ${videoInputDevices.length} 个摄像头`);
                } catch (zxingEnumErr) {
                    console.warn('ZXing枚举设备失败，尝试原生API');
                    
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    videoInputDevices = devices.filter(device => device.kind === 'videoinput');
                    console.log(`✅ 通过原生API找到 ${videoInputDevices.length} 个摄像头`);
                }

                cameraSelect.innerHTML = '<option value="">选择摄像头...</option>';
                
                if (videoInputDevices.length > 0) {
                    videoInputDevices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `摄像头 ${index + 1}`;
                        cameraSelect.appendChild(option);
                    });
                    
                    scanStatus.textContent = `找到 ${videoInputDevices.length} 个摄像头`;
                    
                    const rearCamera = videoInputDevices.find(d => 
                        d.label && (
                            d.label.toLowerCase().includes('rear') || 
                            d.label.toLowerCase().includes('back') ||
                            d.label.includes('后置')
                        )
                    );
                    if (rearCamera) {
                        cameraSelect.value = rearCamera.deviceId;
                        console.log('自动选择后置摄像头:', rearCamera.label);
                    } else if (videoInputDevices.length === 1) {
                        cameraSelect.value = videoInputDevices[0].deviceId;
                    }
                    
                } else {
                    console.log('未找到任何摄像头设备');
                    scanStatus.textContent = '未找到摄像头';
                    cameraSelect.innerHTML = '<option value="">未找到摄像头设备</option>';
                    showStatus('未检测到摄像头设备。请检查设备连接或权限。', 'error');

        // 处理扫描到的数据
 async function processChunkData(data) {
    console.log('处理数据长度:', data.length);
    
    try {
        // 1. 数据清洗
        let trimmed = data.trim();
        
        if (!trimmed.startsWith('{') && trimmed.includes('{')) {
            const braceIndex = trimmed.indexOf('{');
            trimmed = trimmed.substring(braceIndex);
        }
        
        if (!trimmed.endsWith('}') && trimmed.includes('}')) {
            const braceIndex = trimmed.lastIndexOf('}');
            trimmed = trimmed.substring(0, braceIndex + 1);
        }
        
        if (!trimmed.startsWith('{') || !trimmed.endsWith('}')) {
            throw new Error('数据不是有效的JSON格式');
        }
        
        // 2. JSON解析
        let chunk;
        try {
            chunk = JSON.parse(trimmed);
            console.log('✅ JSON解析成功！类型:', chunk.t || 'data');
        } catch (parseErr) {
            throw new Error('JSON解析失败: ' + parseErr.message);
        }
        
        // 3. 检查是否为文件名二维码
        if (chunk.t === 'fn') {
            // 处理文件名二维码
            console.log('📄 处理文件名二维码');
            
            // 检查必需字段
            if (typeof chunk.f !== 'string' || typeof chunk.n !== 'string' || 
                typeof chunk.s !== 'number' || typeof chunk.h !== 'string') {
                throw new Error('文件名数据字段格式错误');
            }
            
            // CRC32校验 - 使用与发送端相同的方式计算
            // 注意：发送端对文件名二维码的CRC32计算不包括h字段
            const crcData = {
                t: chunk.t,
                f: chunk.f,
                n: chunk.n,  // 注意：这里使用Base64编码的文件名
                s: chunk.s,
                ts: chunk.ts,
                tc: chunk.tc
            };
            const jsonStr = JSON.stringify(crcData);
            const calculatedHash = calculateCRC32(jsonStr);
            const hashMatch = calculatedHash === chunk.h.toLowerCase();
            
            if (!hashMatch) {
                console.warn(`文件名校验失败: 计算值=${calculatedHash}, 接收值=${chunk.h}`);
                showFloatingMessage('❌ 文件名校验失败', true);
                return;
            }
            
            // 文件指纹检查
            if (currentFileFingerprint && chunk.f !== currentFileFingerprint) {
                showFloatingMessage('⚠️ 文件指纹不匹配', true);
                return;
            }
            
            // 存储文件名数据
            fileNameData = chunk;
            
            // 解码文件名（Base64 -> 原始文件名）
            try {
                receivedFileName = decodeFileName(chunk.n);
                console.log('✅ 文件名解码成功:', receivedFileName);
            } catch (decodeError) {
                console.error('文件名解码失败，使用原始值:', decodeError);
                receivedFileName = chunk.n;
            }
            
            // 更新信息
            if (!currentFileFingerprint) {
                currentFileFingerprint = chunk.f;
                fingerprintValue.textContent = currentFileFingerprint;
                currentFingerprint.style.display = 'block';
            }
            
            // 设置总分片数
            if (chunk.tc && chunk.tc > 0) {
                totalDataChunks = chunk.tc;
            }
            
            receivedFileSize = chunk.s;
            
            // 存储到本地
             try {
        const store = localforage.createInstance({ name: 'qrcode-filename-separate' });
        await store.setItem('fileNameData', fileNameData);
        await store.setItem('fileName', receivedFileName);
        await store.setItem('fileSize', receivedFileSize);
        await store.setItem('totalDataChunks', totalDataChunks);
        // 保存接收时间
        await store.setItem('receiveTime', new Date().toISOString());
        console.log('✅ 文件名数据已保存');
    } catch (storeErr) {
        console.error('文件名数据存储失败:', storeErr);
    }
    
    // 立即更新接收时间显示
    receiveTime.textContent = new Date().toLocaleString();
    
    showFloatingMessage('📄 文件名分片扫描成功');
    showStatus(`✅ 文件名接收: ${receivedFileName}`, 'success');

            
        } else {
            // 处理数据二维码
            console.log('处理数据二维码');
            
            // 检查必需字段
            if (typeof chunk.i !== 'number' || typeof chunk.t !== 'number' || 
                typeof chunk.h !== 'string' || typeof chunk.d !== 'string' ||
                typeof chunk.f !== 'string') {
                throw new Error('数据二维码字段格式错误');
            }
            
            // 文件指纹检查
            if (!currentFileFingerprint) {
                // 首次接收数据，设置文件指纹
                currentFileFingerprint = chunk.f;
                fingerprintValue.textContent = currentFileFingerprint;
                currentFingerprint.style.display = 'block';
                console.log('🆔 新文件指纹:', currentFileFingerprint);
                showStatus(`开始接收新文件 (${chunk.t}个数据分片)`, 'info');
            } else if (chunk.f !== currentFileFingerprint) {
                showFloatingMessage('⚠️ 二维码不属于当前文件', true);
                return;
            }
            
            // CRC32校验 - 对数据字段进行校验（与发送端一致）
            const calculatedHash = calculateCRC32(chunk.d);
            const hashMatch = calculatedHash === chunk.h.toLowerCase();
            
            if (!hashMatch) {
                console.warn(`数据分片 ${chunk.i+1} 校验失败: 计算值=${calculatedHash}, 接收值=${chunk.h}`);
                showFloatingMessage(`❌ 分片 ${chunk.i+1} 校验失败`, true);
                return;
            }
            
            // 检查是否重复
            if (receivedDataChunks.has(chunk.i)) {

            showStatus(`✅ 成功接收数据分片 ${chunk.i + 1}/${totalDataChunks}`, 'success');
        }
        
        // 更新UI

    }

async function loadSavedChunks() {
    try {
        const store = localforage.createInstance({ name: 'qrcode-filename-separate' });
        const keys = await store.keys();
        
        // 加载文件名数据
        const savedFileNameData = await store.getItem('fileNameData');
        if (savedFileNameData) {
            fileNameData = savedFileNameData;
            
            // 解码保存的文件名

                receivedFileName = fileNameData.n;

            // 加载保存的接收时间
            const savedReceiveTime = await store.getItem('receiveTime');
            if (savedReceiveTime) {
                // 将ISO字符串转换为本地时间格式
                const date = new Date(savedReceiveTime);
                receiveTime.textContent = date.toLocaleString();
            } else {
                receiveTime.textContent = new Date().toLocaleString();
            }
        }
        
        // 加载数据分片
        for (const key of keys) {
            if (key.startsWith('dataChunk_')) {
                const id = parseInt(key.replace('dataChunk_', ''));
                const chunk = await store.getItem(key);
                if (chunk) {
                    receivedDataChunks.set(id, chunk);
                }
            }
        }
        
        console.log('从存储加载了', receivedDataChunks.size, '个数据分片');
        if (receivedFileName) {
            console.log('已加载文件名:', receivedFileName);
        }
        
    } catch (err) {
        console.error('加载存储失败:', err);
    }
}

        // 重组文件
        assembleBtn.addEventListener('click', async () => {
            if (!fileNameData) {
                showStatus('❌ 缺少文件名数据', 'error');
                return;
            }
            
            if (receivedDataChunks.size < totalDataChunks) {
                const missing = totalDataChunks - receivedDataChunks.size;
                showStatus(`❌ 缺少 ${missing} 个数据分片`, 'error');
                showFloatingMessage(`❌ 缺少 ${missing} 个数据分片`, true);
                return;
            }
            
            try {
                assembleBtn.disabled = true;
                assembleBtnText.textContent = '⏳ 重组中...';
                showStatus('🛠️ 正在重组文件...', 'info');
                
                // 组合所有数据分片
                let combinedBase64 = '';
                for (let i = 0; i < totalDataChunks; i++) {
                    const chunk = receivedDataChunks.get(i);
                    if (!chunk || !chunk.d) {
                        throw new Error(`❌ 缺少数据分片 ${i+1}`);
                    }
                    combinedBase64 += chunk.d;
                }
                
                // 补全Base64
                while (combinedBase64.length % 4 !== 0) {
                    combinedBase64 += '=';
                }
                
                // Base64解码
                const binaryString = atob(combinedBase64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                // 解压缩
                let decompressed;
                try {
                    decompressed = pako.inflate(bytes);
                } catch (decompressError) {
                    console.log('解压缩失败，使用原始数据:', decompressError);
                    decompressed = bytes;
                }
                
                // 创建Blob
                const blob = new Blob([decompressed]);
                const url = URL.createObjectURL(blob);
                
                // 使用接收到的文件名
                const finalFileName = receivedFileName;
                
                // 更新文件信息

        // 工具函数
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function getFileTypeFromName(fileName) {

            const types = {
                'txt': '文本文档',
                'pdf': 'PDF文档',
                'jpg': 'JPEG图片',
                'jpeg': 'JPEG图片',
                'png': 'PNG图片',
                'gif': 'GIF图片',
                'zip': '压缩文件',
                'rar': '压缩文件',
                'doc': 'Word文档',
                'docx': 'Word文档',
